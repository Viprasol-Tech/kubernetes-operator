[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-operator"
version = "0.2.0"
description = "Kubernetes operator (Python/kopf) with a pure, tested reconcile loop managing Deployment, Service, and ConfigMap."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = ["kubernetes", "operator", "kopf", "python", "k8s", "controller", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# Runtime deps needed only when actually running the operator in a cluster.
operator = ["kopf>=1.37", "kubernetes>=29.0"]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Viprasol-Tech/kubernetes-operator"
Repository = "https://github.com/Viprasol-Tech/kubernetes-operator"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_operator"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["B008", "B027", "UP042"]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = [
    "src/k8s_operator/reconcile.py",
    "src/k8s_operator/__init__.py",
    "src/k8s_operator/handlers.py",
]

[[tool.mypy.overrides]]
module = ["kopf", "kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
